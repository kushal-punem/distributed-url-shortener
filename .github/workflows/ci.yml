name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint & Test Microservices
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: urluser
          POSTGRES_PASSWORD: urlpassword
          POSTGRES_DB: urlshortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: mongoadmin
          MONGO_INITDB_ROOT_PASSWORD: mongopassword
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            redirection-api/package.json
            analytics-api/package.json

      - name: Install & Test Redirection Service
        working-directory: ./redirection-api
        run: |
          npm ci
          npm run build
          npm test

      - name: Install & Test Analytics Service
        working-directory: ./analytics-api
        run: |
          npm ci
          npm run build
          npm test

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Redirection API Image
        uses: docker/build-push-action@v5
        with:
          context: ./redirection-api
          push: false
          tags: distributed-url-shortener/redirection-api:latest

      - name: Build Analytics API Image
        uses: docker/build-push-action@v5
        with:
          context: ./analytics-api
          push: false
          tags: distributed-url-shortener/analytics-api:latest
